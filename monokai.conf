##### Theme

# -------------------------------
# --> Monokai Classic
thm_bg="#272822"  # Monokai background
thm_fg="#f8f8f2"  # Monokai foreground

## -------------------------------
## Accent colors
thm_orange="#fd971f"  # Monokai orange (used for variables, functions)
thm_red="#f92672"      # Monokai red (used for keywords, errors)
thm_pink="#fd5ff1"     # Monokai pink (used for special, constants)
thm_purple="#ae81ff"   # Monokai purple (used for classes, types)
thm_yellow="#e6db74"   # Monokai yellow (used for strings)
thm_green="#a6e22e"    # Monokai green (used for comments, docstrings)
thm_cyan="#66d9ef"     # Monokai cyan (used for support, functions)
thm_brown="#75715e"    # Monokai brown (used for gutter, inactive text)
thm_white="#f8f8f0"    # Monokai white (used for selection, highlights)

## -------------------------------
## Surfaces and overlays
thm_subtext_1="#75715e"  # Monokai subtext_1 (comments)
thm_subtext_0="#a59f85"  # Monokai subtext_0 (inactive text)
thm_overlay_2="#49483e"  # Monokai overlay_2 (line highlight)
thm_overlay_1="#3e3d32"  # Monokai overlay_1 (selection)
thm_overlay_0="#23241f"  # Monokai overlay_0 (current line)
thm_surface_2="#383830"  # Monokai surface_2 (panel background)
thm_surface_1="#272822"  # Monokai surface_1 (main background)
thm_surface_0="#1e1f1c"  # Monokai surface_0 (darker background)
thm_base="#272822"       # Monokai base
thm_mantle="#1e1f1c"     # Monokai mantle
thm_crust="#131313"      # Monokai crust

## -------------------------------
## Custom vars for easy tweaks

thm_active="${thm_bg}"
thm_inactive="${thm_bg}"

thm_active_fg="${thm_purple}"
thm_inactive_fg="${thm_overlay_0}"

thm_pane_active="${thm_purple}"
thm_pane_inactive="${thm_bg}"

thm_msg_bg="${thm_purple}"
thm_msg_fg="${thm_crust}"

thm_win_active="${thm_bg}"
thm_win_inactive="${thm_bg}"

thm_win_active_fg="${thm_purple}"
thm_win_inactive_fg="${thm_overlay_2}"

