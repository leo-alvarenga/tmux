# ----------- #
# Styles      #
# Powerline   #
# (Slash)     #
# ----------- #

# Angled powerline spin-off of the bubble (rounded) style.
# Every segment edge uses the slash separators:
#   \ue0be  upper-right triangle  (opening edge)
#   \ue0ba  lower-right triangle  (closing edge)
# To revert to the rounded look, source styles-bubble.conf instead.

# PANE & BORDER DESIGN

# Pane borders
set -g pane-border-style "fg=$bgPane"
set -g pane-active-border-style "fg=$accent"

# Message text (Command mode)
set -g message-style "bg=$accent,fg=$bgSurface,bold"

# STATUS BAR DESIGN (Slash Aesthetic)
set -g status-justify left
set -g status-position top
set -g status-style "bg=$bgMain,fg=$text" # Background 'default' for transparency

# --- LEFT SIDE ---
set -g status-left "#[fg=$bgSurface,bg=$accent]  #[fg=$accent,bg=]"

# --- WINDOW TABS ---
setw -g window-status-separator ""

# Active Window (Slash shape)
setw -g window-status-current-format "#[fg=$accent,bg=default]#[fg=$bgSurface,bg=$accent,bold]#[fg=$bgSurface,bg=$accent,bold] #I #[fg=$accent,bg=$bgInactive]#[fg=$accent,bg=$bgInactive] #W #{?window_zoomed_flag, ,}#[fg=$bgInactive,bg=default]"
setw -g window-status-format "#[fg=$bgInactive,bg=default]#[fg=$bgInactive,bg=$bgInactive]#[fg=$bgMain,bg=$bgInactive] #I #[fg=$bgInactive,bg=$bgSurface]#[fg=$bgInactive,bg=$bgSurface] #W #[fg=$bgSurface,bg=default]"

# --- RIGHT SIDE: Hardware ---
set -g status-right-length 150
set -g status-right "#[fg=$bgRight,bg=default]#[fg=$accent,bg=$bgRight,bold]   #(top -bn1 | grep 'Cpu(s)' | awk '{print $2}')%   #(free -h | awk '/^Mem:/ {print $3}') #[fg=$accent,bg=$bgRight]#[fg=$bgSurface,bg=$accent] 󰥔 %H:%M "

