
# Original rounded/bubble style, kept as a toggleable variant

# PANE & BORDER DESIGN

# Pane borders
set -g pane-border-style "fg=$bgPane"
set -g pane-active-border-style "fg=$accent"

# Message & command prompt (fill = full-width bar, tmux >= 3.7)
set -g message-style "bg=$accent,fg=$bgSurface,bold,fill=$accent"
set -g message-command-style "bg=$accent,fg=$bgSurface,bold,fill=$accent"

# STATUS BAR DESIGN (Rounded Aesthetic)
# Separators: \ue0b6 (open) and \ue0b4 (close) - rounded half circles
set -g status-justify left
set -g status-style "bg=$bgMain,fg=$text" # Background 'default' for transparency

# LEFT SIDE
set -g status-left ""

# WINDOW TABS
setw -g window-status-separator " "

# Active Window (Pill shape)
setw -g window-status-current-format "#[fg=$accent,bg=default]#[fg=$bgSurface,bg=$accent,bold]#I#[fg=$accent,bg=$bgInactive]#[fg=$accent,bg=$bgInactive] #W#{?window_zoomed_flag, ,}#[fg=$bgInactive,bg=default]"
setw -g window-status-format "#[fg=$bgInactive,bg=default]#[fg=$bgInactive,bg=$bgInactive]#[fg=$bgMain,bg=$bgInactive]#I#[fg=$bgInactive,bg=$bgSurface]#[fg=$bgInactive,bg=$bgSurface] #W#[fg=$bgSurface,bg=default]"

# RIGHT SIDE: Hardware
set -g status-right "#[fg=$bgRight,bg=default]#[fg=$accent,bg=$bgRight,bold]  #(top -bn1 | grep 'Cpu(s)' | awk '{print $2}')% |  #(free -h | awk '/^Mem:/ {print $3}') #[fg=$accent,bg=$bgRight]#[fg=$bgSurface,bg=$accent]󰥔 %H:%M#[fg=$accent,bg=default]"

