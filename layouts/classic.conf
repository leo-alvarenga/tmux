#-------- #
# Styles      #
# Classic     #
# (Powerline) #
#-------- #

# Streamlined classic powerline: U+E0B0/U+E0B2 chevrons,
# only the active window gets the colored block.

# PANE & BORDER DESIGN

# Pane borders
set -g pane-border-style "fg=$bgPane"
set -g pane-active-border-style "fg=$activeBorder"

# Message & command prompt (fill = full-width bar, tmux >= 3.7)
set -g message-style "bg=$accent,fg=$bgSurface,bold,fill=$accent"
set -g message-command-style "bg=$accent,fg=$bgSurface,bold,fill=$accent"

# STATUS BAR DESIGN (Classic Arrow Aesthetic)
set -g status-justify left
set -g status-style "bg=$bgMain,fg=$text" # Background 'default' for transparency

# LEFT SIDE: session chip
set -g status-left "#[fg=$bgSurface,bg=$accent,bold]   #S #[fg=$accent,bg=$bgMain]"
set -g status-left-length 32

# WINDOW TABS
setw -g window-status-separator ""

# Active Window (accent chevron block)
setw -g window-status-current-format "#[fg=$bgMain,bg=$accent]#[fg=$bgSurface,bg=$accent,bold] #I  #[fg=$bgSurface,bg=$accent]#W #{?window_zoomed_flag, ,}#[fg=$accent,bg=$bgMain]"

# Inactive windows (index bright, name muted)
setw -g window-status-format "#[fg=$bgMain,bg=$bgInactive]#[fg=$dim,bg=$bgInactive] #I  #[fg=$dim,bg=$bgInactive]#W #[fg=$bgInactive,bg=$bgMain]"

# RIGHT SIDE: Hardware
set -g status-right "#[fg=$bgMain,bg=$accent]#[fg=$bgSurface,bg=$accent,bold]  #(top -bn1 | grep 'Cpu(s)' | awk '{print $2}')% #[fg=$accent,bg=$bgInactive]#[fg=$accent,bg=$bgInactive]  #(free -h | awk '/^Mem:/ {print $3}') #[fg=$bgInactive,bg=$accent]#[fg=$bgSurface,bg=$accent,bold] 󰥔 %H:%M "
