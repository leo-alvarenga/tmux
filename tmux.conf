##### Minimal config (Plugin-less)

## Keymaps
source-file "$HOME/.config/tmux/keymaps.conf"

## Options
source-file "$HOME/.config/tmux/options.conf"

## Theme
source-file "$HOME/.config/tmux/everforest.conf"

# To change, replace the above line with the theme you want, for example:
# source-file "$HOME/.config/tmux/catppuccin.conf"

## Styles
source-file "$HOME/.config/tmux/styles-powerline.conf"
# To revert to the rounded/bubble look, source styles-bubble.conf instead:
# source-file "$HOME/.config/tmux/styles-bubble.conf"

