##### Theme

# -------------------------------
# --> Kanagawa (Wave)

# Backgrounds
sumiInk0="#16161D" # Darkest (Background)
sumiInk3="#1F1F28" # Main (Status bar bg)
sumiInk4="#2A2A37" # Lighter
sumiInk5="#363646" # Even lighter (Inactive panes)

# Accents
waveBlue1="#223249" # Dark Blue (Inactive pills)
waveBlue2="#2D4F67" # Lighter Blue (Active pills)
crystalBlue="#7E9CD8" # Primary Blue (Session name)
fujiWhite="#DCD7BA" # Text
autumnRed="#C34043" # For alerts/messages
boatYellow="#E6C384" # Yellow (CPU pill)
oniViolet="#957FB8" # Primary accent
springGreen="#76946A" # MEM pill/Active window
fujiGray="#727169" # muted text (inactive window names)


######## Generic (colorscheme-agnostic) aliases ########
# layouts/*.conf reference ONLY these camelCase names.
# A new colorscheme (everforest.conf, catppuccin-mocha.conf, ...) defines
# the same names at its end; switch the source-file in tmux.conf to use it.
bgMain=$sumiInk0     # status-bar bg (darkest) / inactive index text
bgSurface=$sumiInk3     # text on colored pills + inactive tab name bg
bgPane=$sumiInk4     # pane borders
bgInactive=$sumiInk5     # inactive tabs + active-tab inner zone
bgRight=$sumiInk5     # status-right pill bg
accent=$oniViolet    # active tabs / session / message / CPU / time
accentText=$sumiInk3     # bold text on accent
text=$fujiWhite    # default status foreground
dim=$fujiGray    # muted text (inactive window names)
memAccent=$springGreen  # memory pill (status-right)
cpuAccent=$boatYellow   # cpu pill (status-right)
timeAccent=$autumnRed   # time pill (status-right)
sessionAccent=$crystalBlue   # session chip (status-left)
activeBorder=$oniViolet    # active pane border
