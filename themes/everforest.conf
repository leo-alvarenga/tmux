##### Theme: Everforest (Dark, Medium)
# Palette reference: https://github.com/sainnhe/everforest/blob/master/palette.md
# Original Everforest color names (as per palette.md) with their hex values.
# Generic aliases at the bottom pull values from these names, so the
# layouts/*.conf files behave identically to kanagawa.conf.

# --- Backgrounds (palette1, dark -> light) ---
bg_dim="#232A2E"   # dimmed / darkest background
bg0="#2D353B"   # default bg, status line (inactive)
bg1="#343F44"   # cursor line, status line (active)
bg2="#3D484D"   # popup menu / floating window / toolbar
bg3="#475258"   # inactive tab label bg
bg4="#4F585E"   # window splits / separators

# --- Foregrounds (palette2) ---
fg="#D3C6AA"   # default foreground / status text
grey0="#7A8478"   # line numbers / UI elements
grey1="#859289"   # comments / UI borders / status line text
grey2="#9DA9A0"   # cursor line number / inactive tab label

# --- Accents (palette2) ---
red="#E67E80"   # errors / delete signs
orange="#E69875"   # operators / tags
yellow="#DBBC7F"   # types / warnings
green="#A7C080"   # functions / strings / search
aqua="#83C092"   # constants / macros
blue="#7FBBB3"   # identifiers / info
purple="#D699B6"   # numbers / preprocessors

# --- Statusline ---
statusline1="#A7C080" # green - active tab / mode indicator
statusline2="#D3C6AA" # text
statusline3="#E67E80" # red - alerts

######## Generic (colorscheme-agnostic) aliases ########
# Same contract as kanagawa.conf: layouts/*.conf reference ONLY these names.
bgMain=$bg_dim        # status-bar bg (darkest)
bgSurface=$bg0           # text on colored pills + inactive tab name bg
bgPane=$bg1           # pane borders
bgInactive=$bg2           # inactive tabs + active-tab inner zone
bgRight=$bg2           # status-right pill bg
accent=$statusline1   # active tabs / session / message / CPU / time
accentText=$bg0           # bold text on accent
text=$fg            # default status foreground
dim=$grey1           # muted text (inactive window names)
memAccent=$aqua      # memory pill (status-right)
activeBorder=$statusline1   # active pane border
