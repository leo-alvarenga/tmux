# ------ #
# Styles #
# ------ #

# PANE & BORDER DESIGN

# Pane borders
set -g pane-border-style "fg=$sumiInk4"
set -g pane-active-border-style "fg=$oniViolet"

# Message text (Command mode)
set -g message-style "bg=$oniViolet,fg=$sumiInk3,bold"

# STATUS BAR DESIGN (Rounded Aesthetic)
set -g status-justify left
set -g status-position top
set -g status-style "bg=$sumiInk0,fg=$fujiWhite" # Background 'default' for transparency

# --- LEFT SIDE ---
set -g status-left ""

# --- WINDOW TABS ---
setw -g window-status-separator " "

# Active Window (Pill shape)
setw -g window-status-current-format "#[fg=$oniViolet,bg=default]#[fg=$sumiInk3,bg=$oniViolet,bold]#[fg=$sumiInk3,bg=$oniViolet,bold]#I#[fg=$oniViolet,bg=$sumiInk5]#[fg=$oniViolet,bg=$sumiInk5] #W#{?window_zoomed_flag, ,}#[fg=$sumiInk5,bg=default]"
setw -g window-status-format "#[fg=$sumiInk5,bg=default]#[fg=$sumiInk5,bg=$sumiInk5,bold]#[fg=$sumiInk0,bg=$sumiInk5,bold]#I#[fg=$sumiInk5,bg=$sumiInk3]#[fg=$sumiInk5,bg=$sumiInk3] #W#[fg=$sumiInk3,bg=default]"

# --- RIGHT SIDE: Hardware ---
set -g status-right-length 150
set -g status-right "#[fg=$sumiInk5,bg=default]#[fg=$oniViolet,bg=$sumiInk5,bold]  #(top -bn1 | grep 'Cpu(s)' | awk '{print $2}')% |  #(free -h | awk '/^Mem:/ {print $3}') #[fg=$oniViolet,bg=$sumiInk5]#[fg=$sumiInk3,bg=$oniViolet]󰥔 %H:%M#[fg=$oniViolet,bg=default]"

